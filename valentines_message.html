<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كل عيد حب وإنتي معايا ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; color: #fff; font-family: Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at top, #7b183e, #260b25 70%);
  }
  main {
    width: min(100%, 520px); padding: 34px 24px; text-align: center;
    border: 1px solid rgba(255,255,255,.25); border-radius: 24px;
    background: rgba(255,255,255,.10); box-shadow: 0 18px 55px #0005;
  }
  .heart { font-size: 48px; margin-bottom: 12px; }
  h1 { font-size: clamp(25px, 7vw, 36px); line-height: 1.5; margin: 0 0 20px; }
  p { font-size: clamp(18px, 4.7vw, 22px); line-height: 2; margin: 0; }
  .end { margin-top: 22px; font-size: 28px; }
</style>
</head>
<body>
<main>
  <div class="heart">❤️</div>
  <h1>كل عيد حب وإنتي معايا يا قلبي</h1>
  <p>أحب أقولك إن عمري اللي راح وإنتي مش معايا مكنتش عايش، لكن الحاضر أحلى بوجودك، والمستقبل هيبقى أحلى وإنتي مراتي، يا عمري اللي جاي كله.</p>
  <div class="end">بحبك ❤️</div>
</main>
</body>
</html>
